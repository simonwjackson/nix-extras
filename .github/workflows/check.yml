name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/validate

  check-and-cache:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/validate
      - name: Stage the cache signing key after checks pass
        env:
          SIGNING_KEY: ${{ secrets.NIX_EXTRAS_CACHE_SECRET_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          install -m 600 /dev/null "$RUNNER_TEMP/cache-key.secret"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/cache-key.secret"
      - name: Publish verified package closures
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_EXTRAS_CACHE_SECRET_KEY_FILE: ${{ runner.temp }}/cache-key.secret
        run: nix run .#cache-publish
      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cache-key.secret"
